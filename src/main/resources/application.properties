spring.application.name=rxlocate

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rxlocate}
spring.datasource.username=${DB_USERNAME:rxlocate_user}
spring.datasource.password=${DB_PASSWORD:rxlocate_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
