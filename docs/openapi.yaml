openapi: 3.0.3
info:
  title: RxLocate API
  version: 1.0.0
  description: REST and USSD integration surface for RxLocate, a pharmacy inventory and medicine-discovery platform.
servers:
  - url: http://localhost:8080
paths:
  /api/medicines/search:
    get:
      summary: Search available medicines
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          example: paracetamol
      responses:
        '200':
          description: Matching medicine records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MedicineResult' }
        '400': { description: Invalid or missing search term }
  /api/ussd:
    post:
      summary: Process a USSD session step
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, example: demo-session }
                phoneNumber: { type: string, example: +251900000000 }
                serviceCode: { type: string, example: '*123#' }
                text: { type: string, example: '1' }
      responses:
        '200':
          description: USSD continuation or completion text
          content:
            text/plain:
              schema: { type: string, example: 'CON Enter medicine name' }
components:
  schemas:
    MedicineResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Paracetamol 500mg }
        quantity: { type: integer, example: 18 }
        sellingPrice: { type: number, format: double, example: 45.0 }
        pharmacy:
          $ref: '#/components/schemas/PharmacySummary'
    PharmacySummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Demo Pharmacy }
        phone: { type: string, example: '+251911000000' }
        address: { type: string, example: Bole, Addis Ababa }
